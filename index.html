<!doctype html>
<html lang="en" data-kit-template="amber-terminal" data-kit-featured-layout="split">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0F14" />
    
    
    <link rel="stylesheet" href="assets/kit/kit.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com/" />
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
<link rel="stylesheet" href="assets/css/polish.css">
    <link rel="stylesheet" href="assets/css/print.css" media="print" />
    <script type="module" src="assets/kit/kit.js"></script>
    <script defer src="assets/js/main.js"></script>
  
<title>Sushila Dawadi | Data Analyst</title>
<meta name="description" content="Data Analyst with 3+ years across banking, financial services and insurance. SQL, Power BI, Tableau and R for KPI reporting and data reconciliation.">
<meta name="author" content="Sushila Dawadi">
<link rel="canonical" href="https://swiskriti-art.github.io/">
<meta property="og:type" content="profile">
<meta property="og:title" content="Sushila Dawadi | Data Analyst">
<meta property="og:description" content="Data Analyst with 3+ years across banking, financial services and insurance. SQL, Power BI, Tableau and R for KPI reporting and data reconciliation.">
<meta property="og:url" content="https://swiskriti-art.github.io/">
<meta property="og:image" content="https://swiskriti-art.github.io/assets/images/social-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sushila Dawadi | Data Analyst">
<meta name="twitter:description" content="Data Analyst with 3+ years across banking, financial services and insurance. SQL, Power BI, Tableau and R for KPI reporting and data reconciliation.">
<meta name="twitter:image" content="https://swiskriti-art.github.io/assets/images/social-card.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Sushila Dawadi","jobTitle":"Data Analyst: SQL, BI Dashboards & KPI Reporting","url":"https://swiskriti-art.github.io/","image":"https://swiskriti-art.github.io/assets/images/sushila-dawadi.jpg","email":"swiskriti@gmail.com","sameAs":["https://www.linkedin.com/in/sushila-dawadi-6538851ab/","https://github.com/swiskriti-art"]}</script>
</head>
  <body>
    <a class="skip-link" href="#top">Skip to content</a>

    <!-- The rack header: the brand plate and the channel selector -->
    <header class="bar" id="bar">
      <div class="bar-inner">
        <a class="brand" href="#top">
          <span class="lamp is-on" aria-hidden="true"></span>
          <span class="brand-plate js-initials" aria-hidden="true"></span>
          <span class="brand-name" data-kit-text="hero.name"></span>
        </a>
        <button
          class="menu-btn"
          type="button"
          aria-expanded="false"
          aria-controls="menu"
          aria-label="Sections"
        >
          <span class="menu-lines" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <nav class="nav" aria-label="Sections">
          <ul class="menu" id="menu" data-kit="nav"></ul>
        </nav>
      </div>
    </header>

    <main id="top" tabindex="-1">
      <!-- The front panel: identity on the left, the instrument column on the right -->
      <section id="hero" class="hero" data-kit-section="hero" aria-label="Introduction">
        <div class="wrap">
          <div class="front panel">
            <div class="front-body">
              <div class="ident">
                <p class="eyebrow">
                  <span class="lamp is-on" aria-hidden="true"></span>
                  <span class="eyebrow-text" data-kit-text="hero.title"></span>
                </p>
                <h1 class="name js-name" data-kit-text="hero.name"></h1>
                <p class="summary" data-kit-text="hero.summary"></p>
                <div class="ctas" data-kit="ctas"></div>
                <div class="ident-foot">
                  <p class="where js-where">
                    <span data-kit="icon" data-icon="map-pin"></span>
                    <span data-kit-text="hero.location"></span>
                  </p>
                  <div class="jacks-row" data-kit="social"></div>
                </div>
              </div>

              <div class="meters js-meters">
                <p class="plate-label"><span class="js-meter-label">Readouts</span></p>
                <div class="readouts" data-kit="readouts"></div>
              </div>

              <div class="inst">
                <figure class="scope scope--photo" data-kit="hero-photo"></figure>
                <div class="status js-status" aria-hidden="true">
                  <p class="status-head">
                    <span class="status-title">Status</span>
                    <span class="status-lamps" aria-hidden="true"
                      ><span class="lamp"></span><span class="lamp"></span><span class="lamp"></span
                    ></span>
                  </p>
                  <ul class="status-lines js-boot"></ul>
                </div>
                <div class="scope scope--trace js-hero-trace" aria-hidden="true">
                  <div class="screen"><svg class="trace js-trace" focusable="false"></svg></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Operator notes: the spec plates, then the paragraphs -->
      <section id="about" class="mod" data-kit-section="about" data-kit-label="About">
        <div class="wrap">
          <header class="mod-head">
            <span class="mod-no js-mod" aria-hidden="true"></span>
            <h2 class="mod-title">About</h2>
            <span class="mod-scale" aria-hidden="true"></span>
            <span class="mod-note js-note"></span>
          </header>
          <dl class="plates" data-kit-list="highlights">
            <template>
              <div class="plate">
                <dt data-kit-field="label"></dt>
                <dd data-kit-field="value"></dd>
              </div>
            </template>
          </dl>
          <div class="notes" data-kit-list="paragraphs">
            <template>
              <p class="note"></p>
            </template>
          </div>
        </div>
      </section>

      <!-- The rack: one unit per role, between the rails -->
      <section
        id="experience"
        class="mod"
        data-kit-section="experience"
        data-kit-label="Experience"
      >
        <div class="wrap">
          <header class="mod-head">
            <span class="mod-no js-mod" aria-hidden="true"></span>
            <h2 class="mod-title">Experience</h2>
            <span class="mod-scale" aria-hidden="true"></span>
            <span class="mod-note js-note"></span>
          </header>
          <div class="rack">
            <ol class="units" data-kit-list="roles">
              <template>
                <li class="unit">
                  <div class="unit-meta">
                    <div class="unit-mark">
                      <div class="unit-logo" data-kit="role-logo"></div>
                      <span class="unit-mono js-mono" aria-hidden="true"></span>
                    </div>
                    <p class="unit-state js-state">
                      <span class="lamp" aria-hidden="true"></span
                      ><span class="js-state-text"></span>
                    </p>
                    <p class="unit-dates well" data-kit="role-dates"></p>
                    <p class="unit-loc" data-kit-field="location"></p>
                  </div>
                  <div class="unit-body">
                    <h3 class="unit-title" data-kit-field="title"></h3>
                    <p class="unit-co">
                      <a
                        class="unit-company"
                        data-kit-field="company"
                        data-kit-href="companyUrl"
                      ></a>
                    </p>
                    <p class="unit-desc" data-kit-field="description"></p>
                    <ul class="unit-hl" data-kit-each="highlights">
                      <li></li>
                    </ul>
                    <div class="unit-earlier js-earlier">
                      <p class="side-label">Earlier here</p>
                      <div class="earlier" data-kit="role-earlier"></div>
                    </div>
                  </div>
                  <div class="unit-side js-unit-side">
                    <p class="side-label">Stack</p>
                    <ul class="patch" data-kit-each="technologies">
                      <li></li>
                    </ul>
                  </div>
                </li>
              </template>
            </ol>
          </div>
        </div>
      </section>

      <!-- Projects: featured ones on scope screens, then one row per other project -->
      <section id="projects" class="mod" data-kit-section="projects" data-kit-label="Projects">
        <div class="wrap">
          <header class="mod-head">
            <span class="mod-no js-mod" aria-hidden="true"></span>
            <h2 class="mod-title">Projects</h2>
            <span class="mod-scale" aria-hidden="true"></span>
            <span class="mod-note js-note"></span>
          </header>
          <div class="feats" data-kit-list="featured">
            <template>
              <article class="feat">
                <div class="feat-screen">
                  <p class="bezel-tag">
                    <span class="lamp is-on" aria-hidden="true"></span>
                    <span class="js-pn"></span>
                    <span class="bezel-cat" data-kit-field="category"></span>
                  </p>
                  <figure class="scope-media" data-kit="project-media"></figure>
                </div>
                <div class="feat-notes">
                  <h3 class="feat-name" data-kit-field="name"></h3>
                  <p class="feat-desc" data-kit-field="description"></p>
                  <ul class="feat-hl" data-kit-each="highlights">
                    <li></li>
                  </ul>
                  <div class="feat-foot">
                    <ul class="patch" data-kit-each="technologies">
                      <li></li>
                    </ul>
                    <div class="links" data-kit="project-links"></div>
                  </div>
                </div>
              </article>
            </template>
          </div>
          <p class="rows-label js-rows-label">More projects</p>
          <ol class="rows" data-kit-list="projects">
            <template>
              <li class="row">
                <div class="row-screen">
                  <span class="row-no js-pn" aria-hidden="true"></span>
                  <figure class="row-media" data-kit="project-media"></figure>
                </div>
                <div class="row-body">
                  <p class="row-cat" data-kit-field="category"></p>
                  <h3 class="row-name" data-kit-field="name"></h3>
                  <p class="row-desc" data-kit-field="description"></p>
                  <ul class="row-hl" data-kit-each="highlights">
                    <li></li>
                  </ul>
                </div>
                <div class="row-side">
                  <ul class="patch" data-kit-each="technologies">
                    <li></li>
                  </ul>
                  <div class="links" data-kit="project-links"></div>
                </div>
              </li>
            </template>
          </ol>
        </div>
      </section>

      <!-- The patch bay: one strip per skill group -->
      <section id="skills" class="mod" data-kit-section="skills" data-kit-label="Skills">
        <div class="wrap">
          <header class="mod-head">
            <span class="mod-no js-mod" aria-hidden="true"></span>
            <h2 class="mod-title">Skills</h2>
            <span class="mod-scale" aria-hidden="true"></span>
            <span class="mod-note js-note"></span>
          </header>
          <div class="bay panel">
            <ul class="bay-rows" data-kit-list="groups">
              <template>
                <li class="bay-row">
                  <div class="bay-label">
                    <span class="lamp is-on" aria-hidden="true"></span>
                    <h3 class="bay-name" data-kit-field="name"></h3>
                    <span class="bay-qty js-qty"></span>
                  </div>
                  <ul class="bay-jacks" data-kit-each="items">
                    <li></li>
                  </ul>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </section>

      <!-- The log: education and certifications side by side -->
      <div class="pair">
        <section
          id="education"
          class="mod mod--half"
          data-kit-section="education"
          data-kit-label="Education"
        >
          <header class="mod-head">
            <span class="mod-no js-mod" aria-hidden="true"></span>
            <h2 class="mod-title">Education</h2>
            <span class="mod-scale" aria-hidden="true"></span>
          </header>
          <ol class="log panel" data-kit-list="entries">
            <template>
              <li class="log-row">
                <p class="log-date well" data-kit="role-dates"></p>
                <div class="log-body">
                  <h3 class="log-name" data-kit-field="institution"></h3>
                  <p class="log-sub">
                    <span class="log-degree" data-kit-field="degree"></span
                    ><span class="log-sep">, </span
                    ><span class="log-field" data-kit-field="field"></span>
                  </p>
                  <p class="log-meta" data-kit-field="location"></p>
                  <ul class="log-notes" data-kit-each="details">
                    <li></li>
                  </ul>
                </div>
              </li>
            </template>
          </ol>
        </section>

        <section
          id="certifications"
          class="mod mod--half"
          data-kit-section="certifications"
          data-kit-label="Certifications"
        >
          <header class="mod-head">
            <span class="mod-no js-mod" aria-hidden="true"></span>
            <h2 class="mod-title">Certifications</h2>
            <span class="mod-scale" aria-hidden="true"></span>
          </header>
          <ol class="log panel" data-kit-list="items">
            <template>
              <li class="log-row">
                <p class="log-date well" data-kit-field="date"></p>
                <div class="log-body">
                  <h3 class="log-name">
                    <a class="cert-link" data-kit-field="name" data-kit-href="url"></a>
                  </h3>
                  <p class="log-sub" data-kit-field="issuer"></p>
                </div>
              </li>
            </template>
          </ol>
        </section>
      </div>

      <!-- Contact: the note, the status lamp and every channel -->
      <section id="contact" class="mod" data-kit-section="contact" data-kit-label="Contact">
        <div class="wrap">
          <header class="mod-head">
            <span class="mod-no js-mod" aria-hidden="true"></span>
            <h2 class="mod-title">Contact</h2>
            <span class="mod-scale" aria-hidden="true"></span>
          </header>
          <div class="tx panel">
            <div class="tx-lead">
              <p class="tx-intro" data-kit-text="contact.intro"></p>
              <p class="tx-status js-avail">
                <span class="lamp is-on" aria-hidden="true"></span>
                <span class="tx-status-k">Status</span>
                <span class="tx-status-v" data-kit-text="contact.availability"></span>
              </p>
              <div class="tx-ctas js-tx-ctas"></div>
            </div>
            <ul class="tx-list" data-kit="contact-list"></ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="base">
      <div class="wrap base-inner">
        <p class="base-line" data-kit="footer"></p>
        <a class="base-top" href="#top"
          >Back to top <span data-kit="icon" data-icon="arrow-up-right"></span
        ></a>
      </div>
    </footer>
  </body>
</html>
