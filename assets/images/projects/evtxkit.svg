<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-05 evtxkit chunk-parallel EVTX decode pipeline</title>
<desc>Blueprint schematic: EVTX file to 64 KiB slots, per-chunk parallel workers (CRC32, framing, BinXML, templates, render), ordered sink, output, and three key readouts.</desc>
<style>
text{font-family:"IBM Plex Mono, SFMono-Regular, Consolas, monospace";font-size:10px;letter-spacing:.06em;fill:#E7EEF5;text-transform:uppercase}
.s{fill:#E7EEF5;opacity:.7}
.k{fill:#FFB454}
.kb{fill:#FFB454;font-size:11px;font-weight:700}
.box{fill:none;stroke:#E7EEF5;stroke-opacity:.7;stroke-width:1}
.key{stroke:#FFB454;stroke-width:1;fill:none}
.ln{stroke:#E7EEF5;stroke-opacity:.5;stroke-width:1;fill:none}
</style>
<defs>
<pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
<path d="M16 0H0V16" fill="none" stroke="#E7EEF5" stroke-opacity="0.05"/>
</pattern>
<pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M80 0H0V80" fill="none" stroke="#E7EEF5" stroke-opacity="0.09"/>
</pattern>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0L10 5L0 10z" fill="#FFB454"/>
</marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0L10 5L0 10z" fill="#E7EEF5" fill-opacity="0.6"/>
</marker>
</defs>

<rect x="0" y="0" width="640" height="360" fill="#0B0F14"/>
<rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
<rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

<rect x="16" y="16" width="608" height="22" class="box" stroke-opacity="0.5"/>
<text x="28" y="31">PN-05 · EVTXKIT · CHUNK-PARALLEL EVTX DECODER</text>

<rect x="16" y="150" width="100" height="50" class="box"/>
<text x="66" y="179" text-anchor="middle">EVTX FILE</text>

<line x1="116" y1="175" x2="140" y2="175" class="key" marker-end="url(#a)"/>
<rect x="140" y="150" width="120" height="50" class="box"/>
<text x="200" y="171" text-anchor="middle">64 KIB SLOTS</text>
<text x="200" y="186" text-anchor="middle" class="s">CHUNK / CORRUPT</text>

<line x1="260" y1="175" x2="280" y2="175" class="key" marker-end="url(#a)"/>
<rect x="280" y="60" width="180" height="208" class="ln"/>
<text x="290" y="76" class="s">PER CHUNK · N WORKERS</text>

<rect x="300" y="88" width="140" height="24" class="box"/>
<text x="370" y="104" text-anchor="middle">CRC32 VERIFY</text>
<line x1="370" y1="112" x2="370" y2="124" class="key" marker-end="url(#a)"/>

<rect x="300" y="124" width="140" height="24" class="box"/>
<text x="370" y="140" text-anchor="middle">RECORD FRAMING</text>
<line x1="370" y1="148" x2="370" y2="160" class="key" marker-end="url(#a)"/>

<rect x="300" y="160" width="140" height="24" class="box"/>
<text x="370" y="176" text-anchor="middle">BINXML TOKENS</text>
<line x1="370" y1="184" x2="370" y2="196" class="key" marker-end="url(#a)"/>

<rect x="300" y="196" width="140" height="24" class="box"/>
<text x="370" y="212" text-anchor="middle">TEMPLATES</text>
<line x1="370" y1="220" x2="370" y2="232" class="key" marker-end="url(#a)"/>

<rect x="300" y="232" width="140" height="24" class="box"/>
<text x="370" y="248" text-anchor="middle">RENDER JSONL/XML</text>

<line x1="460" y1="175" x2="490" y2="175" class="key" marker-end="url(#a)"/>
<rect x="490" y="150" width="134" height="50" class="box"/>
<text x="557" y="171" text-anchor="middle">ORDERED SINK</text>
<text x="557" y="186" text-anchor="middle" class="s">BTREEMAP REORDER</text>

<line x1="557" y1="200" x2="557" y2="236" class="ln" marker-end="url(#g)"/>
<rect x="490" y="236" width="134" height="32" class="box"/>
<text x="557" y="256" text-anchor="middle">STDOUT / FILE</text>

<rect x="16" y="296" width="190" height="48" class="box"/>
<text x="111" y="315" text-anchor="middle" class="kb">64 KIB</text>
<text x="111" y="331" text-anchor="middle" class="s">CHUNK UNIT</text>

<rect x="225" y="296" width="190" height="48" class="box"/>
<text x="320" y="315" text-anchor="middle" class="kb">4,805</text>
<text x="320" y="331" text-anchor="middle" class="s">RECORDS MATCHED</text>

<rect x="434" y="296" width="190" height="48" class="box"/>
<text x="529" y="315" text-anchor="middle" class="kb">790 MIB/S</text>
<text x="529" y="331" text-anchor="middle" class="s">PARSE · 8 THREADS</text>
</svg>