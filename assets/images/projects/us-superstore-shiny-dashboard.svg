<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-01 R-Shiny Dashboard app data flow</title>
<desc>Left key-column filters and Subset button produce a dataset, which feeds right-hand table and plot tabs, shown on Display, with CSV download.</desc>
<style>
.t{font-family:"IBM Plex Mono, SFMono-Regular, Consolas, monospace";font-size:9px;letter-spacing:.06em;fill:#E7EEF5}
.s{font-family:"IBM Plex Mono, SFMono-Regular, Consolas, monospace";font-size:9px;letter-spacing:.06em;fill:#E7EEF5;fill-opacity:.7}
.h{font-family:"IBM Plex Mono, SFMono-Regular, Consolas, monospace";font-size:10px;letter-spacing:.06em;fill:#E7EEF5}
.a{font-family:"IBM Plex Mono, SFMono-Regular, Consolas, monospace";font-size:9px;letter-spacing:.06em;fill:#FFB454}
</style>
<defs>
<pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse">
<path d="M16 0H0V16" fill="none" stroke="#E7EEF5" stroke-opacity="0.05" stroke-width="1"/>
</pattern>
<pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M80 0H0V80" fill="none" stroke="#E7EEF5" stroke-opacity="0.09" stroke-width="1"/>
</pattern>
<marker id="ah" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0L6 3L0 6z" fill="#E7EEF5" fill-opacity="0.8"/>
</marker>
<marker id="ahA" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
<path d="M0 0L6 3L0 6z" fill="#FFB454"/>
</marker>
</defs>

<rect x="0" y="0" width="640" height="360" fill="#0B0F14"/>
<rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
<rect x="0" y="0" width="640" height="360" fill="url(#major)"/>

<!-- title strip -->
<rect x="16" y="16" width="608" height="24" fill="none" stroke="#E7EEF5" stroke-opacity="0.6" stroke-width="1"/>
<text x="28" y="32" class="h">PN-01 · R-SHINY DASHBOARD · U.S. SUPERSTORE SALES ANALYSIS</text>

<!-- left panel -->
<rect x="16" y="56" width="168" height="280" fill="none" stroke="#E7EEF5" stroke-opacity="0.6" stroke-width="1"/>
<text x="28" y="72" class="t">LEFT PANEL</text>
<text x="28" y="84" class="s">KEY-COLUMN FILTERS</text>

<rect x="28" y="96" width="144" height="22" fill="none" stroke="#E7EEF5" stroke-opacity="0.5" stroke-width="1"/>
<text x="36" y="111" class="t">REGION</text>
<rect x="28" y="124" width="144" height="22" fill="none" stroke="#E7EEF5" stroke-opacity="0.5" stroke-width="1"/>
<text x="36" y="139" class="t">CATEGORY</text>
<rect x="28" y="152" width="144" height="22" fill="none" stroke="#E7EEF5" stroke-opacity="0.5" stroke-width="1"/>
<text x="36" y="167" class="t">SEGMENT</text>
<rect x="28" y="180" width="144" height="22" fill="none" stroke="#E7EEF5" stroke-opacity="0.5" stroke-width="1"/>
<text x="36" y="195" class="t">YEAR <tspan class="a">2014</tspan> – <tspan class="a">2018</tspan></text>

<rect x="28" y="216" width="144" height="28" fill="none" stroke="#FFB454" stroke-width="1"/>
<text x="100" y="234" class="a" text-anchor="middle">SUBSET</text>

<!-- dataset -->
<line x1="172" y1="230" x2="230" y2="230" stroke="#FFB454" stroke-width="1" marker-end="url(#ahA)"/>
<rect x="232" y="202" width="112" height="56" fill="none" stroke="#E7EEF5" stroke-opacity="0.8" stroke-width="1"/>
<text x="288" y="222" class="t" text-anchor="middle">DATASET</text>
<text x="288" y="240" class="s" text-anchor="middle">FILTERED ROWS</text>

<!-- right panel -->
<rect x="376" y="56" width="248" height="280" fill="none" stroke="#E7EEF5" stroke-opacity="0.6" stroke-width="1"/>
<text x="388" y="72" class="t">RIGHT PANEL · TABS</text>
<rect x="388" y="82" width="110" height="20" fill="none" stroke="#E7EEF5" stroke-opacity="0.6" stroke-width="1"/>
<text x="443" y="96" class="t" text-anchor="middle">TABLE</text>
<rect x="506" y="82" width="110" height="20" fill="none" stroke="#E7EEF5" stroke-opacity="0.6" stroke-width="1"/>
<text x="561" y="96" class="t" text-anchor="middle">PLOTS</text>

<rect x="388" y="112" width="228" height="48" fill="none" stroke="#E7EEF5" stroke-opacity="0.5" stroke-width="1"/>
<text x="396" y="130" class="t">DATA TABLE</text>
<text x="396" y="146" class="s">SUBSET ROWS · KEY COLUMNS</text>

<rect x="388" y="172" width="228" height="48" fill="none" stroke="#E7EEF5" stroke-opacity="0.5" stroke-width="1"/>
<text x="396" y="190" class="t">PLOTS</text>
<text x="396" y="206" class="s">AXES FROM KEY COLUMNS</text>

<rect x="388" y="228" width="228" height="24" fill="none" stroke="#FFB454" stroke-width="1"/>
<text x="502" y="244" class="a" text-anchor="middle">DISPLAY</text>

<rect x="388" y="268" width="228" height="40" fill="none" stroke="#E7EEF5" stroke-opacity="0.6" stroke-width="1"/>
<text x="396" y="284" class="t">VISUALS ON DISPLAY</text>
<text x="396" y="298" class="s">TABLES AND PLOTS RENDERED</text>

<!-- dataset to tabs -->
<line x1="344" y1="230" x2="362" y2="230" stroke="#FFB454" stroke-width="1"/>
<line x1="362" y1="136" x2="362" y2="230" stroke="#FFB454" stroke-width="1"/>
<line x1="362" y1="136" x2="386" y2="136" stroke="#E7EEF5" stroke-opacity="0.8" stroke-width="1" marker-end="url(#ah)"/>
<line x1="362" y1="196" x2="386" y2="196" stroke="#E7EEF5" stroke-opacity="0.8" stroke-width="1" marker-end="url(#ah)"/>

<!-- display flow -->
<line x1="502" y1="220" x2="502" y2="226" stroke="#E7EEF5" stroke-opacity="0.8" stroke-width="1" marker-end="url(#ah)"/>
<line x1="502" y1="252" x2="502" y2="266" stroke="#FFB454" stroke-width="1" marker-end="url(#ahA)"/>

<!-- download -->
<line x1="288" y1="258" x2="288" y2="282" stroke="#E7EEF5" stroke-opacity="0.8" stroke-width="1" marker-end="url(#ah)"/>
<rect x="232" y="284" width="112" height="30" fill="none" stroke="#E7EEF5" stroke-opacity="0.6" stroke-width="1"/>
<text x="288" y="303" class="t" text-anchor="middle">DOWNLOAD CSV</text>
</svg>