<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-11 binscope static triage pipeline</title>
<desc>Blueprint schematic: samples and CLI feed format parsing, content passes and anomaly detection, then the YAML capability rule engine, triage report, terminal/JSON output and compare/cluster.</desc>
<style>
.t{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:10px;letter-spacing:0.06em;fill:#E7EEF5;text-anchor:middle}
.s{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:9px;letter-spacing:0.06em;fill:#E7EEF5;fill-opacity:0.7;text-anchor:middle}
.h{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:10px;letter-spacing:0.06em;fill:#E7EEF5;text-anchor:start}
.a{fill:#FFB454}
.b{fill:#0B0F14;stroke:#E7EEF5;stroke-opacity:0.6;stroke-width:1}
.w{fill:none;stroke:#E7EEF5;stroke-opacity:0.6;stroke-width:1}
</style>
<defs>
<pattern id="gm" width="16" height="16" patternUnits="userSpaceOnUse">
<path d="M16 0H0V16" fill="none" stroke="#E7EEF5" stroke-opacity="0.05" stroke-width="1"/>
</pattern>
<pattern id="gM" width="80" height="80" patternUnits="userSpaceOnUse">
<path d="M80 0H0V80" fill="none" stroke="#E7EEF5" stroke-opacity="0.09" stroke-width="1"/>
</pattern>
<marker id="ah" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#E7EEF5" fill-opacity="0.7"/>
</marker>
<marker id="aa" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 z" fill="#FFB454"/>
</marker>
</defs>
<rect width="640" height="360" fill="#0B0F14"/>
<rect width="640" height="360" fill="url(#gm)"/>
<rect width="640" height="360" fill="url(#gM)"/>
<rect x="16" y="16" width="608" height="24" class="w"/>
<text x="28" y="32" class="h">PN-11 · BINSCOPE · STATIC TRIAGE PIPELINE</text>

<g>
<rect x="24" y="80" width="100" height="40" class="b"/>
<text x="74" y="97" class="t a">34</text>
<text x="74" y="111" class="s">BUILT-IN RULES</text>

<rect x="24" y="160" width="100" height="40" class="b"/>
<text x="74" y="178" class="t">SAMPLES</text>
<text x="74" y="191" class="s">files / dirs</text>

<rect x="24" y="240" width="100" height="40" class="b"/>
<text x="74" y="258" class="t">BINSCOPE CLI</text>
<text x="74" y="271" class="s">clap</text>

<rect x="180" y="80" width="130" height="40" class="b"/>
<text x="245" y="98" class="t">FORMAT PARSE</text>
<text x="245" y="111" class="s">goblin · verneed</text>

<rect x="180" y="160" width="130" height="40" class="b"/>
<text x="245" y="178" class="t">CONTENT PASSES</text>
<text x="245" y="191" class="s">digests · strings</text>

<rect x="180" y="240" width="130" height="40" class="b"/>
<text x="245" y="256" class="t">COMPARE/CLUSTER</text>
<text x="245" y="269" class="s">TLSH · ssdeep</text>

<rect x="370" y="80" width="110" height="40" class="b"/>
<text x="425" y="98" class="t">ANOMALIES</text>
<text x="425" y="111" class="s">entropy · W+X</text>

<rect x="370" y="160" width="110" height="40" class="b" stroke="#FFB454" stroke-opacity="0.8"/>
<text x="425" y="178" class="t">RULE ENGINE</text>
<text x="425" y="191" class="s">all · any · not</text>

<rect x="370" y="240" width="110" height="40" class="b"/>
<text x="425" y="258" class="t">RULES YAML</text>
<text x="425" y="271" class="s">strict validation</text>

<rect x="512" y="80" width="104" height="40" class="b"/>
<text x="564" y="98" class="t">TERMINAL</text>
<text x="564" y="111" class="s">colour · escaped</text>

<rect x="512" y="160" width="104" height="40" class="b" stroke="#FFB454" stroke-opacity="0.8"/>
<text x="564" y="178" class="t">TRIAGE REPORT</text>
<text x="564" y="191" class="s">with evidence</text>

<rect x="512" y="240" width="104" height="40" class="b"/>
<text x="564" y="258" class="t">JSON / JSONL</text>
<text x="564" y="271" class="s">exit 3 on gate</text>
</g>

<g fill="none" stroke="#E7EEF5" stroke-opacity="0.7" stroke-width="1">
<polyline points="124,180 152,180 152,100 180,100" marker-end="url(#ah)"/>
<line x1="124" y1="180" x2="180" y2="180" marker-end="url(#ah)"/>
<line x1="74" y1="240" x2="74" y2="200" marker-end="url(#ah)"/>
<line x1="124" y1="260" x2="180" y2="260" marker-end="url(#ah)"/>
<line x1="310" y1="100" x2="370" y2="100" marker-end="url(#ah)"/>
<line x1="310" y1="180" x2="370" y2="180" marker-end="url(#ah)"/>
<line x1="245" y1="200" x2="245" y2="240" marker-end="url(#ah)"/>
<line x1="425" y1="120" x2="425" y2="160" marker-end="url(#ah)"/>
<line x1="425" y1="240" x2="425" y2="200" marker-end="url(#ah)"/>
<line x1="564" y1="160" x2="564" y2="120" marker-end="url(#ah)"/>
<line x1="564" y1="200" x2="564" y2="240" marker-end="url(#ah)"/>
</g>
<line x1="480" y1="180" x2="512" y2="180" stroke="#FFB454" stroke-width="1" marker-end="url(#aa)"/>

<line x1="24" y1="300" x2="616" y2="300" class="w" stroke-opacity="0.4"/>
<text x="24" y="318" class="s" style="text-anchor:start">NEVER RUNS OR MODIFIES INPUT · OFFLINE · STATIC ONLY</text>
</svg>