<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
<title>PN-14 stridediff: STRIDE threat delta gate</title>
<desc>Model feeds STRIDE rules, then a base/head diff, then a gate that is also fed by recorded mitigations. The gate output renders a pull-request comment. Key path in amber.</desc>
<defs>
<style>text{font-family:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;font-size:9px;letter-spacing:0.06em;fill:#E7EEF5}</style>
<pattern id="minor" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#E7EEF5" stroke-opacity="0.05"/></pattern>
<pattern id="major" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0H0V80" fill="none" stroke="#E7EEF5" stroke-opacity="0.09"/></pattern>
<marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#E7EEF5" fill-opacity="0.7"/></marker>
<marker id="ahA" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#FFB454"/></marker>
</defs>
<rect x="0" y="0" width="640" height="360" fill="#0B0F14"/>
<rect x="0" y="0" width="640" height="360" fill="url(#minor)"/>
<rect x="0" y="0" width="640" height="360" fill="url(#major)"/>
<rect x="16" y="16" width="608" height="28" fill="none" stroke="#E7EEF5" stroke-opacity="0.5"/>
<text x="28" y="34" font-size="11">PN-14 · STRIDEDIFF · STRIDE THREAT DELTA GATE</text>

<rect x="16" y="76" width="160" height="60" fill="#0B0F14" stroke="#E7EEF5" stroke-opacity="0.6"/>
<text x="28" y="96" font-size="11">MODEL</text>
<text x="28" y="112" fill-opacity="0.7">ZONES, COMPONENTS,</text>
<text x="28" y="124" fill-opacity="0.7">FLOWS, DATA CLASS</text>

<rect x="240" y="76" width="160" height="60" fill="#0B0F14" stroke="#E7EEF5" stroke-opacity="0.6"/>
<text x="252" y="96" font-size="11">STRIDE RULES</text>
<text x="252" y="112" fill-opacity="0.7">threatsForFlow</text>
<text x="252" y="124" fill-opacity="0.7">threats per flow</text>

<rect x="464" y="76" width="160" height="60" fill="#0B0F14" stroke="#E7EEF5" stroke-opacity="0.6"/>
<text x="476" y="96" font-size="11">DIFF BASE / HEAD</text>
<text x="476" y="112" fill-opacity="0.7">ADDED, REMOVED,</text>
<text x="476" y="124" fill-opacity="0.7">ESCALATED</text>

<rect x="16" y="184" width="160" height="60" fill="#0B0F14" stroke="#E7EEF5" stroke-opacity="0.6"/>
<text x="28" y="204" font-size="11">MITIGATIONS</text>
<text x="28" y="220" fill-opacity="0.7">ID · CONTROL · OWNER</text>
<text x="28" y="232" fill-opacity="0.7">RECORDED PER THREAT</text>

<rect x="240" y="184" width="160" height="60" fill="#0B0F14" stroke="#E7EEF5" stroke-opacity="0.6"/>
<text x="252" y="204" font-size="11">GATE</text>
<text x="252" y="220" fill-opacity="0.7">NEW OR ESCALATED</text>
<text x="252" y="232" fill-opacity="0.7">NO MITIGATION = FAIL</text>

<rect x="464" y="184" width="160" height="60" fill="#0B0F14" stroke="#E7EEF5" stroke-opacity="0.6"/>
<text x="476" y="204" font-size="11">RENDER COMMENT</text>
<text x="476" y="220" fill-opacity="0.7">VERDICT + MERMAID DFD</text>
<text x="476" y="232" fill-opacity="0.7">BOUNDARY CROSSINGS</text>

<line x1="176" y1="106" x2="240" y2="106" stroke="#E7EEF5" stroke-opacity="0.7" stroke-width="1" marker-end="url(#ah)"/>
<line x1="400" y1="106" x2="464" y2="106" stroke="#E7EEF5" stroke-opacity="0.7" stroke-width="1" marker-end="url(#ah)"/>
<line x1="176" y1="214" x2="240" y2="214" stroke="#E7EEF5" stroke-opacity="0.7" stroke-width="1" marker-end="url(#ah)"/>
<line x1="400" y1="214" x2="464" y2="214" stroke="#FFB454" stroke-width="1" marker-end="url(#ahA)"/>
<polyline points="544,136 544,160 320,160 320,184" fill="none" stroke="#FFB454" stroke-width="1" marker-end="url(#ahA)"/>

<rect x="16" y="272" width="160" height="52" fill="#0B0F14" stroke="#E7EEF5" stroke-opacity="0.6"/>
<text x="28" y="306" font-size="24" fill="#FFB454">24</text>
<text x="64" y="306" font-size="9">TESTS</text>

<text x="464" y="270" font-size="9" fill="#FFB454">KEY PATH</text>
<text x="200" y="296" fill-opacity="0.7">GATE FAILS ON NEW OR ESCALATED RISK</text>
<text x="200" y="310" fill-opacity="0.7">WITHOUT A RECORDED CONTROL AND OWNER</text>
</svg>